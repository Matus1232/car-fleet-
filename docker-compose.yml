services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      ENVIRONMENT: production  # vývojový override ho prepíše na development
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY must be set in .env}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      # Skutočnú IP klienta posiela nginx (služba web) v hlavičke X-Real-IP.
      CLIENT_IP_HEADER: X-Real-IP
    ports:
      # Len pre tento počítač (127.0.0.1): prehliadač volá API cez web na porte 5173.
      # Port ostáva kvôli /docs. Zvonka by sa dalo poslať vymyslené X-Real-IP priamo na API.
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ./frontend
    ports:
      - "5173:80"  # aplikácia na http://localhost:5173 (tá istá adresa ako pri npm run dev, sedí na CORS_ORIGINS)
    depends_on:
      - api

volumes:
  postgres_data:
