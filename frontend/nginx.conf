server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # React Router: /vehicles nie je súbor na disku. Keď súbor neexistuje, vrátime index.html
    # a o tom, ktorú stránku zobraziť, rozhodne React v prehliadači.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
