# Šablóna: pri štarte kontajnera do nej nginx dosadí premenné prostredia ${PORT} a ${API_UPSTREAM}
# (obraz nginx to robí sám so súbormi v /etc/nginx/templates). Predvolené hodnoty sú v Dockerfile.
# Na Railway nastaví PORT Railway a API_UPSTREAM ty, napr. http://backend.railway.internal:8000.

# Skutočná IP klienta: Railway ju posiela v hlavičke X-Real-IP. Keď hlavička chýba
# (lokálny beh bez Railway), použijeme IP, z ktorej prišlo spojenie.
map $http_x_real_ip $client_real_ip {
    ""      $remote_addr;
    default $http_x_real_ip;
}

# Ako prišiel request ku klientovi: Railway posiela X-Forwarded-Proto (https alebo http).
map $http_x_forwarded_proto $original_proto {
    ""      $scheme;
    default $http_x_forwarded_proto;
}

server {
    listen ${PORT};
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;  # nevypisuj verziu nginx v hlavičkách a chybových stránkach

    # HTTPS rieši Railway: šifrovanie končí na jeho okraji a k nám príde už obyčajné HTTP.
    # Keď niekto otvorí http:// adresu, pošleme ho na https://, aby heslo nešlo nezašifrované.
    if ($http_x_forwarded_proto = "http") {
        return 301 https://$host$request_uri;
    }

    # HSTS: prehliadač si na rok zapamätá, že túto stránku má otvárať len cez HTTPS,
    # aj keď používateľ napíše http://. Cez obyčajné HTTP (lokálne) hlavičku prehliadač ignoruje.
    add_header Strict-Transport-Security "max-age=31536000" always;
    # Content-Security-Policy: prehliadač spustí len skripty z našej adresy. Keby sa do stránky
    # predsa dostal cudzí <script>, nevykoná sa. Spolu s httpOnly cookie je to ochrana proti XSS.
    # data: pri obrázkoch: Vite malé SVG (obrys auta, kalendára) vloží priamo do CSS.
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;  # prehliadač nehádá typ súboru
    add_header Referrer-Policy "same-origin" always;  # cudzím stránkam neposielame našu adresu

    # DNS server, ktorý pozná adresy služieb v súkromnej sieti (Railway aj docker compose).
    # Obraz nginx ho vyčíta z /etc/resolv.conf, keď je zapnuté NGINX_ENTRYPOINT_LOCAL_RESOLVERS
    # (pozri Dockerfile). valid=10s: zistenú adresu si pamätá najviac 10 sekúnd.
    resolver ${NGINX_LOCAL_RESOLVERS} valid=10s;

    # API: všetko pod /api pošleme ďalej na backend a /api z adresy odstránime
    # (/api/vehicles -> backend /vehicles). Frontend aj API sú tak pre prehliadač jedna adresa.
    location /api/ {
        # Adresa backendu je v premennej, nie priamo v proxy_pass. S pevnou adresou by nginx
        # zistil IP backendu len raz pri štarte. Po novom nasadení backendu (nový kontajner =
        # nová IP) by ďalej volal starú IP a každá požiadavka by skončila chybou 504.
        # S premennou sa nginx pýta DNS priebežne (podľa resolver vyššie) a štart nezlyhá,
        # ani keď backend práve nebeží.
        set $api_upstream ${API_UPSTREAM};
        # Pri premennej v proxy_pass už lomka na konci /api neodstráni, spravíme to sami.
        # Parametre za otáznikom (?start=...&end=...) ostanú zachované.
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $api_upstream;
        # Keď sa na backend nedá pripojiť do 5 s, vzdáme to (predvolené je 60 s). Používateľ tak
        # hneď uvidí chybu, namiesto toho, aby minútu pozeral na "Načítavam…". Týka sa to len
        # nadviazania spojenia, dlhšie bežiaca požiadavka sa nepreruší.
        proxy_connect_timeout 5s;
        proxy_set_header Host $host;
        # Backend za nami vidí len IP nginxu, skutočnú IP mu pošleme v hlavičke (rate limiter).
        proxy_set_header X-Real-IP $client_real_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $original_proto;
    }

    # React Router: /vehicles nie je súbor na disku. Keď súbor neexistuje, vrátime index.html
    # a o tom, ktorú stránku zobraziť, rozhodne React v prehliadači.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
