# Vývojové nastavenie. Docker Compose ho načíta automaticky spolu s docker-compose.yml.
# Na produkcii spúšťaj len základný súbor:  docker compose -f docker-compose.yml up -d
services:
  api:
    command: ["sh", "-c", "alembic upgrade head && exec uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"]
    volumes:
      - ./backend:/code        # live reload pri vývoji
